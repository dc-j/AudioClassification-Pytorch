<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1100" viewBox="0 0 1600 1100">
  <defs>
    <style>
      .bg { fill: #f7f9fc; }
      .title { fill: #123b66; font: 700 36px "Noto Sans CJK SC", "Microsoft YaHei", Arial, sans-serif; text-anchor: middle; }
      .lane { fill: #ffffff; stroke: #294b6d; stroke-width: 2; }
      .lane-head { fill: #1f5d92; stroke: #1f5d92; stroke-width: 2; }
      .lane-title { fill: #ffffff; font: 700 23px "Noto Sans CJK SC", "Microsoft YaHei", Arial, sans-serif; text-anchor: middle; }
      .box { fill: #ffffff; stroke: #315b84; stroke-width: 2; }
      .box-blue { fill: #eaf3fb; stroke: #315b84; stroke-width: 2; }
      .box-yellow { fill: #fff7e6; stroke: #a06a00; stroke-width: 2; }
      .box-purple { fill: #f3effc; stroke: #6d5799; stroke-width: 2; }
      .box-red { fill: #fceeed; stroke: #9b4a45; stroke-width: 2; }
      .box-green { fill: #edf7f0; stroke: #3f7d51; stroke-width: 2; }
      .text { fill: #26384d; font: 20px "Noto Sans CJK SC", "Microsoft YaHei", Arial, sans-serif; text-anchor: middle; }
      .small { fill: #42556d; font: 17px "Noto Sans CJK SC", "Microsoft YaHei", Arial, sans-serif; text-anchor: middle; }
      .arrow { fill: none; stroke: #294b6d; stroke-width: 2.5; marker-end: url(#arrowhead); }
      .feedback { fill: none; stroke: #6d5799; stroke-width: 2.5; stroke-dasharray: 8 6; marker-end: url(#arrowhead-purple); }
    </style>
    <marker id="arrowhead" markerWidth="12" markerHeight="8" refX="11" refY="4" orient="auto">
      <path d="M0,0 L12,4 L0,8 Z" fill="#294b6d" />
    </marker>
    <marker id="arrowhead-purple" markerWidth="12" markerHeight="8" refX="11" refY="4" orient="auto">
      <path d="M0,0 L12,4 L0,8 Z" fill="#6d5799" />
